{#include base}
{#title}Transaktion bearbeiten - {budget.name}{/title}
{#body}
<div class="page-header">
    <div class="page-title-group">
        <h1>Buchungssatz bearbeiten (#{transaktion.id})</h1>
        <p class="page-subtitle">Mandant: <strong>{budget.name}</strong> · Erfasst von {transaktion.erfasstVon.name}</p>
    </div>
    <a href="/budgets/{budget.id}" class="btn btn-secondary btn-sm">Zurück zur Übersicht</a>
</div>

<div class="auth-wrapper" style="max-width: 520px; margin: 0;">
    <div class="panel">
        <div class="panel-header">
            <h2>Buchungsdetails anpassen</h2>
        </div>
        <div class="panel-body">
            {#if fehler??}
                <div class="fehler">{fehler}</div>
            {/if}

            <form method="post" action="/budgets/{budget.id}/transaktionen/{transaktion.id}/bearbeiten">
                <div class="form-group">
                    <label for="kategorieId">Kategorie (Kostenart)</label>
                    <select id="kategorieId" name="kategorieId" required>
                        {#for k in kategorienListe}
                            <option value="{k.id}" {#if k.id == transaktion.kategorie.id}selected{/if}>{k.name} ({k.topf})</option>
                        {/for}
                    </select>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="betrag">Betrag (CHF)</label>
                        <input type="number" step="0.01" min="0.01" id="betrag" name="betrag" value="{transaktion.betrag}" required>
                    </div>

                    <div class="form-group">
                        <label for="datum">Valutadatum</label>
                        <input type="date" id="datum" name="datum" value="{transaktion.datum}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="beschreibung">Buchungstext / Beschreibung</label>
                    <input type="text" id="beschreibung" name="beschreibung" value="{transaktion.beschreibung}" required>
                </div>

                <button type="submit">Speichern</button>
            </form>
        </div>
    </div>
</div>
{/body}
{/include}
