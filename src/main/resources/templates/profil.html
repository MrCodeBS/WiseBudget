{#include base}
{#title}Profil - WiseBudget{/title}
{#body}
<h1>Mein Profil</h1>

{#if gespeichert}
    <div class="erfolg">Profil wurde gespeichert.</div>
{/if}

{#if fehler??}
    <div class="fehler">{fehler}</div>
{/if}

<form method="post" action="/profil">
    <div class="form-group">
        <label for="email">E-Mail (nicht änderbar)</label>
        <input type="email" id="email" value="{aktuellerBenutzer.email}" disabled>
    </div>

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{aktuellerBenutzer.name}" required>
    </div>

    <div class="form-group">
        <label for="geburtsdatum">Geburtsdatum</label>
        <input type="date" id="geburtsdatum" name="geburtsdatum" value="{aktuellerBenutzer.geburtsdatum}" required>
    </div>

    <div class="form-group">
        <label for="erwerbsstatus">Erwerbsstatus</label>
        <select id="erwerbsstatus" name="erwerbsstatus" required>
            {#for status in erwerbsstatusListe}
                <option value="{status}" {#if status == aktuellerBenutzer.erwerbsstatus}selected{/if}>{status}</option>
            {/for}
        </select>
    </div>

    <div class="form-group">
        <label for="kantonId">Kanton</label>
        <select id="kantonId" name="kantonId" required>
            {#for kanton in kantone}
                <option value="{kanton.id}" {#if kanton.id == aktuellerBenutzer.kanton.id}selected{/if}>{kanton.name} ({kanton.kuerzel})</option>
            {/for}
        </select>
    </div>

    <button type="submit">Speichern</button>
</form>
{/body}
{/include}
