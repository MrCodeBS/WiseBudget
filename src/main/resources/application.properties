# Datenbank (Dev & Test: H2 in-memory)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:wisebudget;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:wisebudget_test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# Datenbank (Prod: MySQL)
%prod.quarkus.datasource.db-kind=mysql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/wisebudget}
%prod.quarkus.datasource.username=${DB_USER:wisebudget}
%prod.quarkus.datasource.password=${DB_PASSWORD:wisebudget}
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# Form-basierte Authentifizierung
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login.html
quarkus.http.auth.form.error-page=/login.html?error=true
quarkus.http.auth.form.landing-page=/budgets
quarkus.http.auth.form.cookie-name=quarkus-credential

# Zugriffsschutz
quarkus.http.auth.permission.public.paths=/login.html,/registrieren,/style.css,/j_security_check,/favicon.ico
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.analytics.disabled=true
